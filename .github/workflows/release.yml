name: Build TreeFrogUI release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (leave blank for build-only)
        required: false
        type: string
      base_tag:
        description: Latest full release used to seed the build
        required: true
        type: string
      update_base_tag:
        description: Oldest compatible release used for the cumulative update
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [release]

concurrency:
  group: treefrog-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORK_ROOT: /home/runner/sf3000-work
  TOOLCHAIN_URL: https://github.com/game-de-it/sf3000/releases/download/sf3000_toolchain_v0.1/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz

jobs:
  build:
    name: Cross-build and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out TreeFrogUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build and release names
        id: names
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BASE: ${{ inputs.base_tag }}
          INPUT_UPDATE_BASE: ${{ inputs.update_base_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT_NAME" == push ]]; then
            tag="$PUSH_TAG"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            version="$tag"
          else
            version="v0.0.0-ci.${RUN_NUMBER}"
          fi
          base="$INPUT_BASE"
          update_base="$INPUT_UPDATE_BASE"
          [[ -n "$base" ]] || { echo 'base_tag is required for release builds' >&2; exit 1; }
          [[ -n "$update_base" ]] || { echo 'update_base_tag is required for release builds' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "update_base=$update_base" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake unzip zip jq

      - name: Download SF3000 cross-toolchain
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/sf3000toolchain"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" \
            | tar -xz -C "$WORK_ROOT/sf3000toolchain"
          # The public SDK archive contains the runtime SONAME but some
          # versions omit the development symlink used by picoarch's linker.
          sysroot="$WORK_ROOT/sf3000toolchain/mipsel-buildroot-linux-gnu_sdk-buildroot/mipsel-buildroot-linux-gnu/sysroot/usr/lib"
          if [[ ! -e "$sysroot/libpng12.so" && -e "$sysroot/libpng12.so.0" ]]; then
            ln -s libpng12.so.0 "$sysroot/libpng12.so"
          fi

      - name: Fetch companion source repositories
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          set -euo pipefail
          sudo mkdir -p /home/tomaszz
          sudo ln -sfn "$WORK_ROOT" /home/tomaszz/sf3000-work
          ln -sfn "$GITHUB_WORKSPACE" sf3000_treefrogui
          git clone --depth 1 --branch r36sx https://github.com/tzubertowski/FrogUI.git FrogUI
          git clone --depth 1 --branch r36sx https://github.com/tzubertowski/TreeFrogUI_picoarch.git picoarch
          # The media-player Makefiles refer to ../../../picoarch from the
          # checkout layout used by local development.
          ln -sfn "$WORK_ROOT/picoarch" "$GITHUB_WORKSPACE/../picoarch"
          git -C picoarch submodule update --init --depth 1 libretro-common

      - name: Download previous full release as build base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ steps.names.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TreeFrogUI_*.zip' --dir "$RUNNER_TEMP/base"
          base_zip="$(find "$RUNNER_TEMP/base" -maxdepth 1 -name 'TreeFrogUI_*.zip' -print -quit)"
          [[ -n "$base_zip" ]] || { echo 'Base full release archive not found' >&2; exit 1; }
          unzip -q "$base_zip" -d "$RUNNER_TEMP/base/unpacked"
          [[ -d "$RUNNER_TEMP/base/unpacked/release" ]] || {
            echo 'Base archive does not contain release/' >&2; exit 1;
          }
          # The SDK's libpng12 development files are not consistently present;
          # the previous release already carries the exact target runtime.
          sysroot="$WORK_ROOT/sf3000toolchain/mipsel-buildroot-linux-gnu_sdk-buildroot/mipsel-buildroot-linux-gnu/sysroot/usr/lib"
          png_runtime="$RUNNER_TEMP/base/unpacked/release/cubegm/lib/libpng12.so.0"
          if [[ ! -e "$sysroot/libpng12.so.0" && -f "$png_runtime" ]]; then
            cp "$png_runtime" "$sysroot/libpng12.so.0"
          fi
          if [[ ! -e "$sysroot/libpng12.so" && -e "$sysroot/libpng12.so.0" ]]; then
            ln -s libpng12.so.0 "$sysroot/libpng12.so"
          fi
          # Seed ignored staging files (cores, binaries, FrogShell, BIOS, etc.)
          # from the last full release. New builds replace the binaries they own.
          cp -a "$RUNNER_TEMP/base/unpacked/release/." "$GITHUB_WORKSPACE/sdcard/"

      - name: Download cumulative update base
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE_TAG: ${{ steps.names.outputs.update_base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-base"
          gh release download "$UPDATE_BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TreeFrogUI_*.zip' --dir "$RUNNER_TEMP/update-base"

      - name: Build FrogUI core
        working-directory: ${{ env.WORK_ROOT }}/FrogUI
        run: ./build_libretro.sh

      - name: Build picoarch frontends
        working-directory: ${{ env.WORK_ROOT }}/picoarch
        run: |
          ./build_sf3000.sh
          ./build_picoarch_hi.sh

      - name: Build unified release tree
        working-directory: ${{ env.WORK_ROOT }}/sf3000_treefrogui
        env:
          TREEFROG_STOCK_ROOT: ${{ runner.temp }}/base/unpacked/release/install_first
        run: ./build_release.sh

      - name: Sanity-check cores and resources
        working-directory: ${{ env.WORK_ROOT }}/sf3000_treefrogui
        env:
          BASE_TREE: ${{ runner.temp }}/base/unpacked/release
        run: |
          set -euo pipefail
          current=release/latest/release
          # A CI build starts from the previous full release, so every shipped
          # core/resource must remain present unless it was deliberately
          # removed in the build script. Catch silent cp_if_diff omissions.
          for subtree in cubegm/cores cubegm/bios cubegm/lib frogui; do
            [[ -d "$BASE_TREE/$subtree" ]] || continue
            while IFS= read -r -d '' file; do
              rel=${file#"$BASE_TREE/"}
              [[ -f "$current/$rel" ]] || {
                echo "Missing release payload: $rel" >&2
                exit 1
              }
            done < <(find "$BASE_TREE/$subtree" -type f -print0)
          done
          required=(
            cubegm/picoarch cubegm/picoarch_hi
            cubegm/cores/frogui_libretro.so cubegm/cores/tyrquake_libretro.so
            cubegm/lib/libSDL-1.2.so.0 cubegm/lib/libpng12.so.0
            cubegm/lib/libpng16.so.16
          )
          for rel in "${required[@]}"; do
            [[ -f "$current/$rel" ]] || { echo "Missing required payload: $rel" >&2; exit 1; }
          done
          echo "Release sanity check passed: $(find "$current/cubegm/cores" -name '*.so' | wc -l) cores; resources present."

      - name: Package full install and update
        id: package
        working-directory: ${{ env.WORK_ROOT }}/sf3000_treefrogui
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          update_base_zip="$(find "$RUNNER_TEMP/update-base" -maxdepth 1 -name 'TreeFrogUI_*.zip' -print -quit)"
          TREEFROG_CUMULATIVE_UPDATE=1 ./pack_release.sh "$VERSION" "$update_base_zip"
          ./tests/test_offline_update.sh release/latest/update.zip "$update_base_zip"
          if [[ "$VERSION" == v0.0.0-ci.* ]]; then
            cp "release/latest/TreeFrogUI_${VERSION}.zip" "$RUNNER_TEMP/TreeFrogUI_build.zip"
            cp release/latest/update.zip "$RUNNER_TEMP/update_build.zip"
          else
            echo "full=release/latest/TreeFrogUI_${VERSION}.zip" >> "$GITHUB_OUTPUT"
            echo "update=release/latest/update.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build-only artifacts
        if: steps.names.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: TreeFrogUI-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/TreeFrogUI_build.zip
            ${{ runner.temp }}/update_build.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.names.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease || 'true' }}
        working-directory: ${{ env.WORK_ROOT }}/sf3000_treefrogui
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" "release/latest/TreeFrogUI_${VERSION}.zip" "release/latest/update.zip" --repo "$GITHUB_REPOSITORY" --title "TreeFrogUI ${VERSION}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-unstable* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"

      - name: Post concise release update to Discord
        if: steps.names.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK }}
          RELEASE_TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
        working-directory: ${{ env.WORK_ROOT }}/sf3000_treefrogui
        run: |
          set -euo pipefail

          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          previous_body=$(jq -r --arg tag "$RELEASE_TAG" '
            ([.[] | .tag_name] | index($tag)) as $index |
            if $index != null and .[$index + 1] then
              .[$index + 1].body // ""
            else
              ""
            end
          ' <<<"$releases")

          printf '%s\n' "$previous_body" > "$RUNNER_TEMP/previous-release-notes.md"
          diff -u "$RUNNER_TEMP/previous-release-notes.md" release-notes.md \
            > "$RUNNER_TEMP/release-notes.diff" || test $? -eq 1

          awk '
            !/^\+\+\+ / && /^\+/ {
              sub(/^\+/, "")
              if (NF && shown < 12) {
                print
                shown++
              }
            }
          ' "$RUNNER_TEMP/release-notes.diff" > "$RUNNER_TEMP/new-release-lines.md"

          if [[ ! -s "$RUNNER_TEMP/new-release-lines.md" ]]; then
            printf '%s\n' 'No new release-note lines; open the release for details.' \
              > "$RUNNER_TEMP/new-release-lines.md"
          fi

          release_url=$(jq -r --arg tag "$RELEASE_TAG" \
            '.[] | select(.tag_name == $tag) | .html_url' <<<"$releases")
          description=$(head -c 3800 "$RUNNER_TEMP/new-release-lines.md")
          payload=$(jq -n \
            --arg title "TreeFrogUI $VERSION" \
            --arg url "$release_url" \
            --arg description "$description" \
            '{embeds:[{title:$title,url:$url,description:$description,color:3066993,footer:{text:"New lines since the previous release"}}]}')

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
